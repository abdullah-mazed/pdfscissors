name: Build

on:
  push:
    branches: [ master, main, workflow-test ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            dist/pdfscissors.jar
            lib/itextpdf-5.5.9.jar
            lib/jgoodies-forms-1.10.jar
            lib/jpedal-4.37b36.jar
            lib/flatlaf-3.5.4.jar
            lib/flatlaf-extras-3.5.4.jar
            lib/jsvg-1.4.0.jar
            res/icon.png

  package:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            type: deb
          - os: macos-latest
            label: macos
            type: dmg
          - os: windows-latest
            label: windows
            type: msi
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: jars

      - name: Set version
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == v* ]]; then
            echo "VERSION=${REF#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Convert icon (macOS)
        if: runner.os == 'macOS'
        run: sips -s format icns jars/res/icon.png --out icon.icns

      - name: Convert icon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: magick convert jars/res/icon.png icon.ico

      - name: Package
        shell: bash
        run: |
          mkdir -p package-input dist-package
          cp jars/dist/pdfscissors.jar package-input/
          cp jars/lib/*.jar package-input/
          if [ "$RUNNER_OS" = "macOS" ]; then
            ICON="icon.icns"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ICON="icon.ico"
          else
            ICON="jars/res/icon.png"
          fi
          jpackage \
            --input package-input \
            --main-jar pdfscissors.jar \
            --main-class bd.amazed.pdfscissors.main.PdfscissorsMain \
            --name PDFScissors \
            --app-version "$VERSION" \
            --icon "$ICON" \
            --type ${{ matrix.type }} \
            --dest dist-package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pdfscissors-${{ matrix.label }}
          path: dist-package/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: pdfscissors-linux
          path: release-artifacts/linux

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: pdfscissors-macos
          path: release-artifacts/macos

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: pdfscissors-windows
          path: release-artifacts/windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PDF Scissors ${{ github.ref_name }}"
          body: |
            ## PDF Scissors ${{ github.ref_name }}
            Platform installers are attached below.
          files: |
            release-artifacts/linux/*.deb
            release-artifacts/macos/*.dmg
            release-artifacts/windows/*.msi
          draft: false
          prerelease: false
