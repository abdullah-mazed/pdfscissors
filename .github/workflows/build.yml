name: Build

on:
  push:
    branches: [ master, main, workflow-test ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfscissors
          path: |
            dist/pdfscissors.jar
            lib/itextpdf-5.5.9.jar
            lib/jgoodies-forms-1.10.jar
            lib/jpedal-4.37b36.jar
